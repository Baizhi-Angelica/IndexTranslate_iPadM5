# XcodeGen 工程描述。macOS runner 上 `xcodegen generate` 生成 ITXTranslate.xcodeproj。
# 说明：本机（Windows）没有 Xcode，所有编译都由 GitHub Actions 完成。

name: ITXTranslate

options:
  bundleIdPrefix: com.baizhiangelica
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    GCC_C_LANGUAGE_STANDARD: gnu11
    ONLY_ACTIVE_ARCH: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ITXTranslate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "**/*.h"
    dependencies:
      # 静态 xcframework：只需要链接，不需要嵌入/签名（CI 里下载解压到 Frameworks/）
      - framework: Frameworks/llama.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_NAME: ITXTranslate
        PRODUCT_BUNDLE_IDENTIFIER: com.baizhiangelica.itxtranslate
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ITXTranslate-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources/MT"
          - "$(SRCROOT)/Sources/MT/include"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # 不签名（Sideloadly 负责重签）
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO

schemes:
  ITXTranslate:
    build:
      targets:
        ITXTranslate: all
    run:
      config: Debug
    archive:
      config: Release
