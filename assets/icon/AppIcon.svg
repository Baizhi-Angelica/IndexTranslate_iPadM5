<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="46%" stop-color="#FFFDF2"/>
      <stop offset="82%" stop-color="#FFF7DE"/>
      <stop offset="100%" stop-color="#FFEFC8"/>
    </radialGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE49B" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#F9DB90" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F9DB90" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FBE6AE"/>
      <stop offset="38%" stop-color="#E9BE6A"/>
      <stop offset="72%" stop-color="#D2A045"/>
      <stop offset="100%" stop-color="#B67F2A"/>
    </linearGradient>

    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6DA9B"/>
      <stop offset="100%" stop-color="#DDB25E"/>
    </linearGradient>

    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FDFBF3"/>
      <stop offset="100%" stop-color="#F1E7CE"/>
    </linearGradient>

    <linearGradient id="hairBack" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#F4F8FE"/>
      <stop offset="45%" stop-color="#DDE9F8"/>
      <stop offset="100%" stop-color="#A9C0DE"/>
    </linearGradient>

    <linearGradient id="hairFront" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#EDF4FD"/>
      <stop offset="100%" stop-color="#C3D5EC"/>
    </linearGradient>

    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9F1"/>
      <stop offset="100%" stop-color="#FDEBDA"/>
    </linearGradient>

    <linearGradient id="iris" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7FE3B4"/>
      <stop offset="45%" stop-color="#37B583"/>
      <stop offset="100%" stop-color="#146B4E"/>
    </linearGradient>

    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFEFA"/>
      <stop offset="100%" stop-color="#FBF0D7"/>
    </linearGradient>

    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BE8134"/>
      <stop offset="100%" stop-color="#8C561F"/>
    </linearGradient>

    <filter id="blurBig" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- 光晕 -->
  <circle cx="512" cy="450" r="360" fill="url(#glow)"/>

  <!-- 圣光 -->
  <g stroke="#F0CA83" stroke-width="11" stroke-linecap="round" opacity="0.26">
    <g transform="translate(512 440)">
      <line x1="0" y1="-372" x2="0" y2="-478"/>
      <line x1="262" y1="-262" x2="340" y2="-340"/>
      <line x1="372" y1="0" x2="478" y2="0"/>
      <line x1="-262" y1="-262" x2="-340" y2="-340"/>
      <line x1="-372" y1="0" x2="-478" y2="0"/>
      <line x1="128" y1="-348" x2="166" y2="-450"/>
      <line x1="-128" y1="-348" x2="-166" y2="-450"/>
    </g>
  </g>

  <!-- 光环 -->
  <circle cx="512" cy="440" r="312" fill="none" stroke="url(#goldSoft)" stroke-width="15" opacity="0.8"/>
  <circle cx="512" cy="440" r="288" fill="none" stroke="#FBEDC2" stroke-width="5" opacity="0.8"/>

  <!-- 兜帽（头后） -->
  <path d="M512 176
           C 700 176 812 306 818 500
           L 818 660
           C 812 800 760 900 700 960
           L 324 960
           C 264 900 212 800 206 660
           L 206 500
           C 212 306 324 176 512 176 Z"
        fill="url(#robe)" stroke="#E8CE9C" stroke-width="8"/>

  <!-- 头发（后层，长发外扩） -->
  <path d="M512 212
           C 690 212 760 348 762 520
           C 764 700 796 830 830 950
           L 700 950
           C 686 800 664 690 640 600
           C 620 700 604 830 596 950
           L 428 950
           C 420 830 404 700 384 600
           C 360 690 338 800 324 950
           L 194 950
           C 228 830 260 700 262 520
           C 264 348 334 212 512 212 Z"
        fill="url(#hairBack)"/>

  <!-- 发丝高光 -->
  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M300 470 C 292 600 300 760 330 900"/>
    <path d="M724 470 C 732 600 724 760 694 900"/>
    <path d="M380 300 C 340 380 320 470 316 560"/>
    <path d="M644 300 C 684 380 704 470 708 560"/>
  </g>

  <!-- 身体（白袍） -->
  <path d="M512 610
           C 660 610 762 690 792 812
           L 812 1024
           L 212 1024
           L 232 812
           C 262 690 364 610 512 610 Z"
        fill="url(#robe)" stroke="#EAD0A0" stroke-width="7"/>

  <!-- 袍子上的金边（V 领 + 竖带） -->
  <path d="M420 648 L 512 780 L 604 648" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linejoin="round" opacity="0.95"/>
  <path d="M470 792 L 470 1024" stroke="url(#goldSoft)" stroke-width="22" opacity="0.9"/>
  <path d="M554 792 L 554 1024" stroke="url(#goldSoft)" stroke-width="22" opacity="0.9"/>
  <path d="M330 900 L 372 1024" stroke="#F0DDB2" stroke-width="14" opacity="0.9"/>
  <path d="M694 900 L 652 1024" stroke="#F0DDB2" stroke-width="14" opacity="0.9"/>

  <!-- 书（在身前） -->
  <ellipse cx="512" cy="836" rx="250" ry="128" fill="#FFE7A6" opacity="0.45" filter="url(#blurBig)"/>
  <path d="M262 754 C 340 720 442 718 512 754 C 582 718 684 720 762 754 L 774 928 C 684 892 590 890 512 926 C 434 890 340 892 250 928 Z"
        fill="url(#leather)"/>
  <path d="M512 760 C 444 726 362 722 292 738 L 292 900 C 362 884 444 890 512 924 Z"
        fill="url(#page)" stroke="#E5C992" stroke-width="4"/>
  <path d="M512 760 C 580 726 662 722 732 738 L 732 900 C 662 884 580 890 512 924 Z"
        fill="url(#page)" stroke="#E5C992" stroke-width="4"/>
  <g stroke="#D9A94A" stroke-width="6" stroke-linecap="round" opacity="0.45">
    <line x1="330" y1="776" x2="466" y2="790"/>
    <line x1="330" y1="812" x2="466" y2="826"/>
    <line x1="330" y1="848" x2="466" y2="862"/>
    <line x1="558" y1="790" x2="694" y2="776"/>
    <line x1="558" y1="826" x2="694" y2="812"/>
    <line x1="558" y1="862" x2="694" y2="848"/>
  </g>
  <path d="M512 750 L 512 928" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="512" cy="846" r="60" fill="none" stroke="#F7DFA8" stroke-width="7" opacity="0.65"/>
  <g fill="url(#gold)" transform="translate(512 846)">
    <rect x="-8" y="-46" width="16" height="92" rx="7"/>
    <rect x="-30" y="-17" width="60" height="16" rx="7"/>
  </g>

  <!-- 手（扶在书页两侧） -->
  <g fill="url(#skin)" stroke="#E0BC8C" stroke-width="5">
    <!-- 左手：手背 + 拇指 -->
    <path d="M296 806 C 288 828 292 858 306 872 C 326 862 336 824 330 800 Z"/>
    <path d="M318 800 C 312 790 300 790 296 800 C 300 810 312 812 318 806 Z"/>
    <!-- 右手：镜像 -->
    <path d="M728 806 C 736 828 732 858 718 872 C 698 862 688 824 694 800 Z"/>
    <path d="M706 800 C 712 790 724 790 728 800 C 724 810 712 812 706 806 Z"/>
  </g>
  <g stroke="#E0BC8C" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="308" y1="820" x2="322" y2="838"/>
    <line x1="306" y1="840" x2="320" y2="854"/>
    <line x1="716" y1="820" x2="702" y2="838"/>
    <line x1="718" y1="840" x2="704" y2="854"/>
  </g>

  <!-- 脸 -->
  <path d="M512 258
           C 648 258 712 356 712 462
           C 712 586 626 668 512 668
           C 398 668 312 586 312 462
           C 312 356 376 258 512 258 Z"
        fill="url(#skin)"/>

  <!-- 腮红 -->
  <ellipse cx="386" cy="560" rx="40" ry="22" fill="#FFC9BC" opacity="0.6"/>
  <ellipse cx="638" cy="560" rx="40" ry="22" fill="#FFC9BC" opacity="0.6"/>

  <!-- 眼睛 -->
  <g>
    <!-- 左眼 -->
    <ellipse cx="430" cy="488" rx="58" ry="68" fill="#FFFFFF"/>
    <ellipse cx="430" cy="492" rx="46" ry="56" fill="url(#iris)"/>
    <ellipse cx="430" cy="466" rx="46" ry="28" fill="#0E4A38" opacity="0.34"/>
    <ellipse cx="430" cy="500" rx="20" ry="23" fill="#0B3A2B"/>
    <circle cx="413" cy="471" r="16" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="447" cy="518" r="8" fill="#FFFFFF" opacity="0.8"/>
    <path d="M372 462 C 388 420 472 420 488 462" fill="none" stroke="#3A3340" stroke-width="15" stroke-linecap="round"/>
    <path d="M378 536 C 396 562 464 562 482 536" fill="none" stroke="#6B5560" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <!-- 右眼 -->
    <ellipse cx="594" cy="488" rx="58" ry="68" fill="#FFFFFF"/>
    <ellipse cx="594" cy="492" rx="46" ry="56" fill="url(#iris)"/>
    <ellipse cx="594" cy="466" rx="46" ry="28" fill="#0E4A38" opacity="0.34"/>
    <ellipse cx="594" cy="500" rx="20" ry="23" fill="#0B3A2B"/>
    <circle cx="577" cy="471" r="16" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="611" cy="518" r="8" fill="#FFFFFF" opacity="0.8"/>
    <path d="M536 462 C 552 420 636 420 652 462" fill="none" stroke="#3A3340" stroke-width="15" stroke-linecap="round"/>
    <path d="M542 536 C 560 562 628 562 646 536" fill="none" stroke="#6B5560" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 鼻子 / 嘴 -->
  <path d="M512 548 C 516 554 516 558 512 560" fill="none" stroke="#E0AE90" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M494 596 C 504 606 520 606 530 596" fill="none" stroke="#C98A74" stroke-width="7" stroke-linecap="round"/>

  <!-- 刘海（前层，带尖角） -->
  <path d="M512 216
           C 664 216 730 330 732 430
           C 720 372 690 330 640 306
           C 636 360 620 410 596 444
           C 592 384 574 336 548 306
           C 540 366 528 412 512 446
           C 494 410 480 366 472 306
           C 446 336 430 384 426 444
           C 402 410 386 360 382 306
           C 332 330 302 372 290 430
           C 292 330 358 216 512 216 Z"
        fill="url(#hairFront)"/>

  <!-- 刘海高光 -->
  <path d="M420 268 C 470 244 554 244 604 268 C 552 258 472 258 420 268 Z" fill="#FFFFFF" opacity="0.8"/>

  <!-- 金色头饰 -->
  <path d="M330 404
           C 380 372 644 372 694 404
           L 700 452
           C 640 420 384 420 324 452 Z"
        fill="url(#gold)" stroke="#B67F2A" stroke-width="5"/>
  <path d="M336 418 C 388 392 636 392 688 418" fill="none" stroke="#FBEDC2" stroke-width="7" opacity="0.85"/>
  <!-- 头饰中央小十字 -->
  <g fill="url(#gold)" transform="translate(512 398)">
    <rect x="-6" y="-34" width="12" height="68" rx="5"/>
    <rect x="-22" y="-12" width="44" height="12" rx="5"/>
  </g>
  <circle cx="512" cy="398" r="34" fill="none" stroke="#FBEDC2" stroke-width="5" opacity="0.9"/>

  <!-- 两侧长发（前层，垂到胸前） -->
  <path d="M320 430 C 296 560 300 700 318 860 L 388 860 C 360 700 356 560 372 440 Z" fill="url(#hairFront)"/>
  <path d="M704 430 C 728 560 724 700 706 860 L 636 860 C 664 700 668 560 652 440 Z" fill="url(#hairFront)"/>
  <g stroke="#A9C0DE" stroke-width="6" stroke-linecap="round" opacity="0.45">
    <path d="M340 500 C 330 620 332 740 344 840"/>
    <path d="M684 500 C 694 620 692 740 680 840"/>
  </g>

  <!-- 金色光尘 -->
  <g fill="#F1CB7C" opacity="0.9">
    <circle cx="300" cy="300" r="9"/>
    <circle cx="726" cy="286" r="7"/>
    <circle cx="806" cy="470" r="9"/>
    <circle cx="214" cy="466" r="6"/>
    <circle cx="512" cy="120" r="8"/>
    <circle cx="650" cy="160" r="5"/>
    <circle cx="374" cy="158" r="5"/>
    <circle cx="150" cy="700" r="6"/>
    <circle cx="872" cy="700" r="6"/>
  </g>
</svg>
